name: Android AAB
on:
  push:
    branches: [android-ci]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build unsigned release bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
          ls -la app/build/outputs/bundle/release/
      - name: Publish bundle to android-aab branch
        run: |
          mkdir -p /tmp/out && cp android/app/build/outputs/bundle/release/*.aab /tmp/out/app-release-unsigned.aab
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git checkout --orphan android-aab
          git rm -rqf .
          cp /tmp/out/app-release-unsigned.aab .
          git add app-release-unsigned.aab
          git commit -m "unsigned AAB ${GITHUB_SHA}"
          git push -f origin android-aab
