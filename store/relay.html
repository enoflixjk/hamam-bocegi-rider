<!doctype html><meta charset="utf-8"><title>relay</title>
<script>
// App Store Connect'e başarım görsellerini aktarmak için yardımcı sayfa (yalnızca appstoreconnect.apple.com'a gönderir)
const T = 'https://appstoreconnect.apple.com';
addEventListener('message', async (e) => {
  if (e.origin !== T || !e.data?.want) return;
  const out = {};
  for (const k of e.data.want) { const b = await (await fetch(k.includes('/') ? k : 'ach/' + k + '.png', { cache: 'no-store' })).arrayBuffer(); out[k] = b; }
  e.source.postMessage({ relay: out }, T);
});
parent.postMessage({ relayReady: true }, T);
</script>
